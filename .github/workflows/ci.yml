name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format, test & build
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Accessibility gate (JSX semantics and document contracts)
        run: npm run check:a11y

      - name: Check formatting
        run: npm run format:check

      - name: Unit and major-flow tests
        run: npm test

      - name: Security gate (dependencies and trust-boundary tests)
        run: npm run check:security

      - name: Build (without codegen — no store credentials on CI)
        run: npm run build:ci

      - name: Performance gate (gzip bundle budgets)
        run: npm run check:performance

  browser-flows:
    name: Browser commerce, RTL, axe & visual regression
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run local mocked browser flows
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee /tmp/e2e.log
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_PRODUCT_HANDLE: ${{ vars.E2E_PRODUCT_HANDLE }}
          E2E_SEARCH_TERM: ${{ vars.E2E_SEARCH_TERM }}

      # Artifact downloads are not always reachable from every environment, so
      # the failing assertions are also written into the job summary.
      - name: Summarize browser failures
        if: ${{ failure() }}
        run: |
          {
            echo '### Playwright output (tail)'
            echo '```'
            tail -n 250 /tmp/e2e.log || echo 'no log captured'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload browser failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  lighthouse:
    name: Lighthouse performance, accessibility & CWV budgets
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Enforce Lighthouse budgets on the local mocked production build
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
