name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format, test & build
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Accessibility gate (JSX semantics and document contracts)
        run: npm run check:a11y

      - name: Check formatting
        run: npm run format:check

      - name: Unit and major-flow tests
        run: npm test

      - name: Security gate (dependencies and trust-boundary tests)
        run: npm run check:security

      - name: Build (without codegen — no store credentials on CI)
        run: npm run build:ci

      - name: Performance gate (gzip bundle budgets)
        run: npm run check:performance
